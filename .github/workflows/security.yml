name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security audit
        run: bun audit --audit-level=high

      - name: Run knip (unused dependencies)
        # 1482 文件下 knip 的 oxc-parser 在低配 runner 上会 OOM 崩溃，
        # 故不在此硬阻断；但绝不能静默吞错——结果写日志并作为告警暴露。
        run: bun x knip --no-progress 2>&1 | tee knip-ci.log; echo "knip exit=${LASTEXITCODE}"
        continue-on-error: true

      - name: Upload knip report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knip-report
          path: knip-ci.log
          if-no-files-found: ignore
