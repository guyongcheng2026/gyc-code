name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun x tsc --noEmit -p tsconfig.json

      - name: Encoding check (strict UTF-8 + mojibake)
        run: bun scripts/check-mojibake.mjs

      - name: Bug pattern check (empty catch / self-recursion)
        run: bun scripts/check-bug-patterns.mjs

      - name: Brand compliance check (自有文案禁用他牌品牌词)
        run: node scripts/brand-guard.mjs .

      - name: Build
        run: bun run build

      - name: Security audit (bun)
        run: bun audit 2>&1 || echo "bun audit unavailable, skipping"
        continue-on-error: true

      - name: Security audit (npm)
        run: |
          npm install --package-lock-only 2>/dev/null || true
          npm audit --audit-level=high 2>&1 || echo "npm audit unavailable, skipping"
        continue-on-error: true

      - name: CodeQL Analysis (Security)
        uses: github/codeql-action/analyze@v3
        with:
          category: "security"
        continue-on-error: true

      - name: Test
        run: bun run test
